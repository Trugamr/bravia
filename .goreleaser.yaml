version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    dir: ./cmd/cli
    binary: tv
  - id: remote
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    dir: ./cmd/remote
    binary: remote

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

dockers_v2:
  - id: remote
    ids:
      - remote
    images:
      - ghcr.io/trugamr/bravia-remote
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: docker/Dockerfile.template
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: bravia remote
      org.opencontainers.image.description: Web remote control for Sony Bravia TVs
      org.opencontainers.image.url: https://github.com/trugamr/bravia
      org.opencontainers.image.source: https://github.com/trugamr/bravia
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
